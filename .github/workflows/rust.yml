name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # The worker-signals reader probes a live tmux pane; its end-to-end test
    # drives a real one on its own socket.
    - name: Install tmux
      run: sudo apt-get update && sudo apt-get install -y tmux
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
